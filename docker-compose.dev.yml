services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: licnost
      POSTGRES_PASSWORD: licnost
      POSTGRES_DB: licnost
    ports: ['5432:5432']
    volumes: [licnost-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U licnost -d licnost']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  licnost-postgres:
